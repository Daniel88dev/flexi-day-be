name: ci

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node and pnpm, install dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

  unit:
    name: Build & Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node and pnpm, install dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      # No database here: every unit test mocks its service modules. `DATABASE` is still set
      # because `src/config.ts` validates it at import, but nothing connects to it.
      - name: Set up environment variables
        run: |
          echo "PORT=8080" >> $GITHUB_ENV
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "DATABASE=postgresql://postgres:password@localhost:5432/testdb" >> $GITHUB_ENV
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "BETTER_AUTH_URL=http://localhost:8080" >> $GITHUB_ENV
          echo "TRUSTED_ORIGINS=http://localhost:3000,flexiday://" >> $GITHUB_ENV

      - name: Build application
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test:unit --coverage

  e2e:
    name: E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # The suite runs one file at a time against a shared database, so it is split across
    # runners, each with its own Postgres, instead of across workers.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node and pnpm, install dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Set up environment variables
        run: |
          echo "PORT=8080" >> $GITHUB_ENV
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "DATABASE=postgresql://postgres:password@localhost:5432/testdb" >> $GITHUB_ENV
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "BETTER_AUTH_URL=http://localhost:8080" >> $GITHUB_ENV
          echo "TRUSTED_ORIGINS=http://localhost:3000,flexiday://" >> $GITHUB_ENV

      - name: Generate database schemas
        run: pnpm run db:generate

      - name: Run database migrations
        run: pnpm run db:migrate

      - name: Run e2e tests
        # Calendar direct sync on the fake driver; the client values are dummies it never sends.
        env:
          CALENDAR_SYNC_GOOGLE_ENABLED: "true"
          CALENDAR_SYNC_MICROSOFT_ENABLED: "true"
          CALENDAR_SYNC_DRIVER: fake
          GOOGLE_CLIENT_ID: e2e-google-client-id
          GOOGLE_CLIENT_SECRET: e2e-google-client-secret
          MICROSOFT_CLIENT_ID: e2e-microsoft-client-id
          MICROSOFT_CLIENT_SECRET: e2e-microsoft-client-secret
        run: pnpm run test:e2e --shard=${{ matrix.shard }}/4
