name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the build on a known-vulnerable dependency. The repo is at zero
      # advisories; `overrides` in package.json pin the transitive fixes that
      # upstream has not shipped yet (drizzle-kit still ships the deprecated
      # @esbuild-kit chain, and exceljs still pins uuid@8).
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Set up environment variables
        run: |
          echo "PORT=8080" >> $GITHUB_ENV
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "DATABASE=postgresql://postgres:password@localhost:5432/testdb" >> $GITHUB_ENV
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "BETTER_AUTH_URL=http://localhost:8080" >> $GITHUB_ENV

      - name: Generate database schemas
        run: npm run db:generate

      - name: Run database migrations
        run: npm run db:migrate

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm run start &
          sleep 10 # wait for the app to start

      - name: Run unit tests
        run: npm run test:unit -- --coverage

      - name: Run e2e tests
        run: npm run test:e2e
