name: codeql

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Catches newly-published queries against unchanged code.
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # No build step: javascript-typescript is analysed from source, so the
      # scan does not need the project's toolchain or a database.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3 # v3
