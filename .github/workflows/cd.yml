name: Build and Push to ECR

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  # Lets the build publish a signed provenance attestation for the pushed image.
  attestations: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    concurrency:
      group: ecr-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set image metadata
        id: meta
        run: |
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Ensure ECR repository exists
        shell: bash
        run: |
          set -euo pipefail
          if aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" >/dev/null 2>&1; then
            echo "Repository ${ECR_REPOSITORY} already exists"
          else
            echo "Creating repository ${ECR_REPOSITORY}"
            aws ecr create-repository \
              --repository-name "${ECR_REPOSITORY}" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability MUTABLE \
              >/dev/null
          fi

      - name: Build, tag, and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.meta.outputs.ECR_REGISTRY }}
          IMAGE_TAG_SHA: ${{ steps.meta.outputs.IMAGE_TAG_SHA }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          SHA_IMAGE_FULL_URI="${IMAGE_URI}:${IMAGE_TAG_SHA}"

          echo "Building and pushing base image with SHA tag: ${SHA_IMAGE_FULL_URI}"

          docker buildx create --use --name builder || docker buildx use builder

          # --provenance=false stays: buildx provenance would turn the push into a
          # multi-manifest image index, which App Runner cannot pull. Provenance is
          # attested out-of-band instead (see the attestation step below), which
          # records the same build facts without changing the image manifest.
          docker buildx build --platform linux/amd64 \
             -t "${SHA_IMAGE_FULL_URI}" \
             --build-arg APP_VERSION="${IMAGE_TAG_SHA}" \
             --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
             --provenance=false \
             --metadata-file /tmp/build-metadata.json \
             --push .

          echo "IMAGE_NAME=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "SHA_IMAGE_URI=${SHA_IMAGE_FULL_URI}" >> $GITHUB_OUTPUT
          echo "IMAGE_DIGEST=$(jq -r '.["containerimage.digest"]' /tmp/build-metadata.json)" >> $GITHUB_OUTPUT

      # Deliberately BEFORE the moving tag is promoted. `main`/`latest` is what
      # App Runner auto-deploys, so promoting first would let a failed attestation
      # report red only after the new image was already rolling out.
      #
      # Records which commit, workflow and runner produced this exact digest,
      # signed into GitHub's attestation store. `push-to-registry: false` is
      # explicit rather than defaulted: publishing the attestation as an ECR
      # artifact would add a manifest App Runner has to skip past. Verify with:
      #   gh attestation verify oci://<registry>/<repo>@<digest> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.IMAGE_DIGEST }}
          push-to-registry: false

      - name: Promote moving tag
        env:
          IMAGE_URI: ${{ steps.build.outputs.IMAGE_NAME }}
          SHA_IMAGE_FULL_URI: ${{ steps.build.outputs.SHA_IMAGE_URI }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            MOVING_TAG="latest"
          else
            MOVING_TAG="main"
          fi
          MOVING_IMAGE_FULL_URI="${IMAGE_URI}:${MOVING_TAG}"

          echo "Creating and pushing moving tag: ${MOVING_IMAGE_FULL_URI} pointing to ${SHA_IMAGE_FULL_URI}"

          docker buildx imagetools create \
             --tag "${MOVING_IMAGE_FULL_URI}" \
             "${SHA_IMAGE_FULL_URI}"
