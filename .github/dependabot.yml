version: 2

updates:
  # The npm ecosystem, which also reads pnpm-lock.yaml. Minor and patch land as
  # one grouped PR per week so routine bumps do not become a dozen separate
  # reviews; majors stay individual because they need one, unless a family
  # cannot install apart — see vitest-major below.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Matches minimumReleaseAge in pnpm-workspace.yaml, so a routine bump never proposes a version
    # the install would reject as too new.
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      # The one major that cannot land alone. vitest, @vitest/ui and
      # @vitest/coverage-istanbul peer-depend on each other by exact version, so
      # three separate major PRs are three failed installs, each one the
      # new major arguing with the two still on the old one. Only minor and
      # patch are safe apart, and those already ride the group above.
      vitest-major:
        patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - major

  # The attachment-processor Lambda is a pnpm root of its own, with its own lockfile.
  - package-ecosystem: npm
    directory: /lambda/attachment-processor
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keeps the node:24-alpine digest in Dockerfile and Dockerfile.e2e current. Node majors follow
  # .nvmrc, so Dependabot must not propose 26-alpine on its own.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  # Actions are pinned to commit SHAs, which pins the supply chain but also means
  # nothing updates them by hand. This is what keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # init and analyze are two actions out of one repo, and the action aborts
      # with a configuration error when a workflow runs two versions of itself.
      # Split PRs are two red runs, so every part moves as one.
      codeql-action:
        patterns:
          - github/codeql-action*
